<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Books Gate</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="container topbar-inner"><a class="brand" href="index.html"><div class="logo">BG</div><div><div class="brand-title">BOOKS GATE</div><div class="brand-sub">Vos books magasins au même endroit</div></div></a><div class="search">🔎 <input id="q" placeholder="Rechercher dans ce dossier..."></div><a class="admin-link" href="admin.html">Admin</a></div></header><main class="container"><div class="breadcrumb"><a href="index.html">Accueil</a> / <span id="crumb"></span></div><div class="page-title"><h1 id="title"></h1></div><div id="n"></div><section class="book-grid" id="grid"><div class="empty">Chargement…</div></section></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="common.js"></script><script>(async()=>{const group=qs("group");document.getElementById("title").textContent="Magasins "+group;document.getElementById("crumb").textContent=group;if(notice(document.getElementById("n")))return;const{data}=await supabaseClient.from("books").select("id,title,store_group,year,published_at").eq("is_published",true).eq("store_group",group).order("published_at",{ascending:false});const g=document.getElementById("grid");if(!data||!data.length){g.innerHTML='<div class="empty">Aucun book publié pour le moment.</div>';return}g.innerHTML=data.map(b=>`<article class="book-card"><div class="book-cover">${isNew(b.published_at)?'<span class="badge-new">NOUVEAU</span>':""}${esc(b.title)}</div><div class="book-body"><div class="book-title">${esc(b.title)}</div><div class="meta">${b.year}</div><a class="card-link" href="book.html?id=${b.id}">Voir le book →</a></div></article>`).join("");document.getElementById("q").oninput=e=>[...g.children].forEach(c=>c.style.display=c.innerText.toLowerCase().includes(e.target.value.toLowerCase())?"":"none")})();</script></body></html>
