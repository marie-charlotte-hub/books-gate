<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Books Gate</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header class="topbar"><div class="container topbar-inner">
  <a class="brand" href="index.html"><div class="logo">BG</div><div><div class="brand-title">BOOKS GATE</div><div class="brand-sub">Vos books magasins au même endroit</div></div></a>
  <div class="search">🔎 <input id="searchBooks" placeholder="Rechercher dans ce dossier..."></div>
  <a class="admin-link" href="admin.html">Admin</a>
</div></header>
<main class="container">
  <div class="breadcrumb"><a href="index.html">Accueil</a> / <span id="groupCrumb"></span></div>
  <div class="page-title"><div><h1 id="groupTitle"></h1><div class="sub">Tous les books publiés pour ce groupe de magasins.</div></div></div>
  <div id="configNotice"></div>
  <section class="book-grid" id="booksGrid"><div class="empty">Chargement…</div></section>
</main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="common.js"></script>
<script>
(async()=>{
  const group=qs("group");
  if(!["TMB 63","TMB 70"].includes(group)){location.href="index.html";return}
  document.getElementById("groupTitle").textContent=`Magasins ${group}`;
  document.getElementById("groupCrumb").textContent=`Magasins ${group}`;
  const grid=document.getElementById("booksGrid");
  if(showConfigNotice(document.getElementById("configNotice"))) return;

  const {data,error}=await supabaseClient.from("books").select("id,title,store_group,year,published_at").eq("is_published",true).eq("store_group",group).order("published_at",{ascending:false});
  if(error){grid.innerHTML='<div class="empty">Erreur de chargement.</div>';return}
  if(!data.length){grid.innerHTML=`<div class="empty">Aucun book publié dans ${group} pour le moment.</div>`;return}
  grid.innerHTML=data.map(b=>`
    <article class="book-card">
      <div class="book-cover">${isNew(b.published_at)?'<span class="badge-new">NOUVEAU</span>':""}${escapeHtml(b.title)}</div>
      <div class="book-body"><div class="book-title">${escapeHtml(b.title)}</div><div class="meta">${b.year}</div><a class="card-link" href="book.html?id=${b.id}">Voir le book →</a></div>
    </article>`).join("");

  document.getElementById("searchBooks").addEventListener("input",e=>{
    const q=e.target.value.toLowerCase().trim();
    [...grid.querySelectorAll(".book-card")].forEach(c=>c.style.display=c.innerText.toLowerCase().includes(q)?"":"none");
  });
})();
</script>
</body></html>
