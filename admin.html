<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Books Gate</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="container topbar-inner"><a class="brand" href="index.html"><div class="logo">BG</div><div><div class="brand-title">BOOKS GATE</div><div class="brand-sub">Administration</div></div></a><div></div><a class="admin-link" href="index.html">Retour au site</a></div></header><main class="container"><div class="login-wrap"><div id="n"></div><section class="login-card" id="login"><h1>Connexion Admin</h1><form id="f"><div class="field"><label>E-mail</label><input id="email" type="email" required></div><div class="field"><label>Mot de passe</label><input id="pwd" type="password" required></div><button class="btn btn-primary" style="width:100%">Se connecter</button><div id="m"></div></form></section><section class="login-card" id="panel" style="display:none"><h1>Administration</h1><p class="meta">Connexion réussie. Prochaine étape : importer un book Excel.</p><button class="btn btn-primary" disabled>+ Ajouter un book</button> <button class="btn" id="out">Se déconnecter</button></section></div></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="common.js"></script><script>(async()=>{if(notice(document.getElementById("n")))return;const l=document.getElementById("login"),p=document.getElementById("panel"),m=document.getElementById("m");async function refresh(){const{data:{session}}=await supabaseClient.auth.getSession();if(!session){l.style.display="";p.style.display="none";return}const{data}=await supabaseClient.from("admin_users").select("user_id").eq("user_id",session.user.id);if(data&&data.length){l.style.display="none";p.style.display=""}else{await supabaseClient.auth.signOut();m.textContent="Ce compte n’est pas administrateur."}}document.getElementById("f").onsubmit=async e=>{e.preventDefault();const{error}=await supabaseClient.auth.signInWithPassword({email:email.value.trim(),password:pwd.value});m.textContent=error?error.message:"";if(!error)refresh()};document.getElementById("out").onclick=async()=>{await supabaseClient.auth.signOut();refresh()};refresh()})();</script></body></html>
