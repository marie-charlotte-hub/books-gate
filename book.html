<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Book - Books Gate</title><link rel="stylesheet" href="styles.css"></head><body><header class="topbar"><div class="container topbar-inner"><a class="brand" href="index.html"><div class="logo">BG</div><div><div class="brand-title">BOOKS GATE</div><div class="brand-sub">Vos books magasins au même endroit</div></div></a><div class="search">🔎 <input id="q" placeholder="Rechercher un produit..."></div><a class="admin-link" href="admin.html">Admin</a></div></header><main class="container"><div id="n"></div><div id="root"><div class="empty">Chargement…</div></div></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="common.js"></script><script>(async()=>{if(notice(document.getElementById("n")))return;const id=qs("id");const{data:b}=await supabaseClient.from("books").select("*").eq("id",id).eq("is_published",true).single();if(!b){document.getElementById("root").innerHTML='<div class="empty">Book introuvable.</div>';return}const[{data:f},{data:r}]=await Promise.all([supabaseClient.from("families").select("*").eq("book_id",id).order("sort_order"),supabaseClient.from("book_products").select("id,rank,assortment_code,sort_order,products(id,ean,label,ifls,image_path),families(id,name)").eq("book_id",id).order("sort_order")]);const rows=r||[],counts={};rows.forEach(x=>counts[x.rank||"—"]=(counts[x.rank||"—"]||0)+1);const max=Math.max(1,...Object.values(counts));document.getElementById("root").innerHTML=`<div class="page-title"><h1>${esc(b.title)} ${isNew(b.published_at)?'<span class="pill">NOUVEAU</span>':""}</h1><p class="meta">${esc(b.store_group)} • ${b.year} • ${rows.length} références</p></div><section class="summary-grid"><article class="panel"><h3>Répartition des rangs</h3>${Object.entries(counts).sort().map(([k,v])=>`<div class="rank-row"><b>${esc(k)}</b><div class="bar"><span style="width:${Math.max(7,v/max*100)}%"></span></div><span>${v}</span></div>`).join("")}</article><article class="panel"><h3>Familles du book</h3><div class="chips">${(f||[]).map(x=>`<span class="chip">${esc(x.name)}</span>`).join("")}</div></article></section><div class="section-head"><div><h2>Produits du book</h2><p>${rows.length} références</p></div></div><section class="product-grid" id="pg">${rows.map(x=>{const p=x.products||{},url=p.image_path?`${cfg.SUPABASE_URL}/storage/v1/object/public/product-images/${encodeURI(p.image_path)}`:"";return`<article class="product-card"><div class="product-img">${url?`<img src="${url}" alt="">`:"IMG"}</div><div class="product-body"><div class="product-name">${esc(p.label||"Produit")} ${x.rank?`<span class="pill">${esc(x.rank)}</span>`:""}</div><div class="product-info">EAN : ${esc(p.ean||"—")}<br>IFLS : ${esc(p.ifls||"—")}<br>${x.families?.name?`Famille : ${esc(x.families.name)}`:""}</div></div></article>`}).join("")}</section>`;document.getElementById("q").oninput=e=>[...document.querySelectorAll(".product-card")].forEach(c=>c.style.display=c.innerText.toLowerCase().includes(e.target.value.toLowerCase())?"":"none")})();</script></body></html>
